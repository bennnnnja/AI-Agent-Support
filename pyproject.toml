[project]
name = "ai-agent-support"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "redis>=5.0",
    "langchain-ollama>=1.0",
    "langgraph>=0.2",
    "mcp>=1.0",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "fakeredis>=2.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: pure unit tests (no external services)",
    "integration: tests that require running services",
]
